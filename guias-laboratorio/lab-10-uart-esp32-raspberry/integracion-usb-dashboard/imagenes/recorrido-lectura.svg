<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880"><title>Una lectura en el mensaje, la base de datos y el panel</title><rect width="1440" height="880" fill="#f5f6f2" /><defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#246b50" /></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2565a0" /></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b34339" /></marker><marker id="i" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#203541" /></marker></defs><text x="56" y="74" font-size="42" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="56" dy="0">Una misma lectura en tres lugares</tspan></text><text x="56" y="123" font-size="26" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="56" dy="0">Datos ilustrativos para reconocer el recorrido.</tspan></text><rect x="56" y="192" width="410" height="510" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><text x="81" y="240" font-size="28" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="81" dy="0">1. Mensaje del ESP32</tspan></text><rect x="516" y="192" width="428" height="510" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><text x="541" y="240" font-size="28" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="541" dy="0">2. Fila en SQLite</tspan></text><rect x="994" y="192" width="390" height="510" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><text x="1019" y="240" font-size="28" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="1019" dy="0">3. Dashboard</tspan></text><text x="80" y="299" font-size="22" fill="#203541" font-family="DejaVu Sans Mono" font-weight="400"><tspan x="80" dy="0">{</tspan><tspan x="80" dy="31.24">  "nodo":"esp32-01",</tspan><tspan x="80" dy="31.24">  "variable":"temperatura",</tspan><tspan x="80" dy="31.24">  "valor":25.4,</tspan><tspan x="80" dy="31.24">  "unidad":"C",</tspan><tspan x="80" dy="31.24">  "secuencia":7,</tspan><tspan x="80" dy="31.24">  "estado":"OK",</tspan><tspan x="80" dy="31.24">  "humedad_pct":61.2</tspan><tspan x="80" dy="31.24">}</tspan></text><text x="80" y="648" font-size="22" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="80" dy="0">Un JSON completo por línea.</tspan></text><text x="541" y="302" font-size="23" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="541" dy="0">id</tspan></text><text x="757" y="302" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="757" dy="0">102</tspan></text><text x="541" y="359" font-size="23" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="541" dy="0">nodo</tspan></text><text x="757" y="359" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="757" dy="0">esp32-01</tspan></text><text x="541" y="416" font-size="23" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="541" dy="0">valor / unidad</tspan></text><text x="757" y="416" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="757" dy="0">25.4 C</tspan></text><text x="541" y="473" font-size="23" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="541" dy="0">secuencia</tspan></text><text x="757" y="473" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="757" dy="0">7</tspan></text><text x="541" y="530" font-size="23" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="541" dy="0">estado</tspan></text><text x="757" y="530" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="757" dy="0">NORMAL</tspan></text><text x="541" y="587" font-size="23" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="541" dy="0">hora UTC</tspan></text><text x="757" y="587" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="757" dy="0">15:00:00</tspan></text><text x="541" y="675" font-size="21" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="541" dy="0">ID y hora los añade Raspberry.</tspan></text><text x="1021" y="331" font-size="54" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="1021" dy="0">25,4 °C</tspan></text><text x="1021" y="390" font-size="27" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="1021" dy="0">Humedad: 61,2 %</tspan></text><rect x="1021" y="430" width="330" height="57" rx="18" fill="#e0eee5" stroke="#e0eee5" stroke-width="2" /><text x="1043" y="468" font-size="25" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="1043" dy="0">NORMAL</tspan></text><text x="1021" y="541" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="1021" dy="0">10:00:00 · Colombia</tspan></text><text x="1021" y="594" font-size="29" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="1021" dy="0">Fila ID 102</tspan></text><text x="1021" y="653" font-size="23" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="1021" dy="0">Secuencia del nodo: 7</tspan></text><line x1="470" y1="432" x2="508" y2="432" stroke="#246b50" stroke-width="4" marker-end="url(#g)" /><line x1="948" y1="432" x2="986" y2="432" stroke="#246b50" stroke-width="4" marker-end="url(#g)" /><text x="56" y="765" font-size="27" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="56" dy="0">La hora se presenta en otra zona: 15:00 UTC corresponde a 10:00 en Colombia.</tspan></text><text x="56" y="816" font-size="26" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="56" dy="0">El ID 102 identifica la fila; la secuencia 7 pertenece al emisor. No tienen que coincidir.</tspan></text></svg>