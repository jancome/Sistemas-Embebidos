<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830"><title>Conexiones lógicas del sensor, ESP32 y Raspberry</title><rect width="1440" height="830" fill="#f5f6f2" /><defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#246b50" /></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2565a0" /></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b34339" /></marker><marker id="i" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#203541" /></marker></defs><text x="56" y="74" font-size="39" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="56" dy="0">Conectar el sensor y llevar los datos a Raspberry</tspan></text><text x="56" y="123" font-size="26" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="56" dy="0">Sigue las etiquetas de tu módulo y el pinout de tu placa.</tspan></text><rect x="56" y="205" width="370" height="340" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><text x="86" y="257" font-size="30" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="86" dy="0">Módulo DHT22</tspan></text><text x="86" y="295" font-size="22" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="86" dy="0">Compatible con 3,3 V</tspan></text><rect x="656" y="205" width="352" height="340" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><text x="686" y="257" font-size="30" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="686" dy="0">ESP32-S3</tspan></text><text x="686" y="295" font-size="22" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="686" dy="0">GPIO4 libre y expuesto</tspan></text><text x="86" y="358" font-size="27" fill="#b34339" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="86" dy="0">VCC / +</tspan></text><text x="688" y="358" font-size="27" fill="#b34339" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="688" dy="0">3V3</tspan></text><line x1="656" y1="350" x2="426" y2="350" stroke="#b34339" stroke-width="4" marker-end="url(#r)" /><text x="86" y="428" font-size="27" fill="#2565a0" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="86" dy="0">DATA / S</tspan></text><text x="688" y="428" font-size="27" fill="#2565a0" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="688" dy="0">GPIO4</tspan></text><line x1="426" y1="420" x2="656" y2="420" stroke="#2565a0" stroke-width="4" marker-end="url(#b)" /><text x="86" y="498" font-size="27" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="86" dy="0">GND / −</tspan></text><text x="688" y="498" font-size="27" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="688" dy="0">GND</tspan></text><line x1="426" y1="490" x2="656" y2="490" stroke="#203541" stroke-width="4" /><rect x="1128" y="295" width="258" height="250" rx="18" fill="#e0eee5" stroke="#d9e1db" stroke-width="2" /><text x="1154" y="350" font-size="26" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="1154" dy="0">Raspberry Pi</tspan></text><text x="1154" y="401" font-size="22" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="1154" dy="0">Receptor Python</tspan></text><text x="1154" y="443" font-size="22" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="1154" dy="0">Fuente propia</tspan></text><line x1="1008" y1="460" x2="1128" y2="460" stroke="#246b50" stroke-width="4" marker-end="url(#g)" /><text x="1028" y="409" font-size="24" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="1028" dy="0">USB</tspan></text><text x="1028" y="440" font-size="21" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="1028" dy="0">datos</tspan></text><rect x="56" y="596" width="1330" height="162" rx="18" fill="#e8eff6" stroke="#c9d9e8" stroke-width="2" /><text x="80" y="634" font-size="25" fill="#2565a0" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="80" dy="0">Este es un esquema de señales; el orden dibujado no es el orden físico de los pines.</tspan></text><text x="80" y="679" font-size="25" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="80" dy="0">Para cargar el firmware: ESP32 ↔ computador. Para trabajar: ESP32 ↔ Raspberry.</tspan></text><text x="80" y="722" font-size="25" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="80" dy="0">Cambiar el cable entre etapas. Revisar el cableado con la alimentación desconectada.</tspan></text></svg>