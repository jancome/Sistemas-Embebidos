<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990"><title>Arquitectura de SQLite y MySQL</title><rect width="1440" height="990" fill="#f5f6f2" /><defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#246b50" /></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2565a0" /></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#b34339" /></marker><marker id="i" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#203541" /></marker></defs><text x="56" y="74" font-size="40" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="56" dy="0">SQLite y MySQL: cómo accede la aplicación</tspan></text><text x="56" y="123" font-size="26" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="56" dy="0">SQL es el lenguaje. El motor determina cómo se administra la base.</tspan></text><rect x="56" y="175" width="622" height="650" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><rect x="713" y="175" width="671" height="650" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><text x="83" y="230" font-size="36" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="83" dy="0">SQLite</tspan></text><text x="741" y="230" font-size="36" fill="#2565a0" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="741" dy="0">MySQL</tspan></text><rect x="86" y="273" width="561" height="168" rx="18" fill="#e0eee5" stroke="#e0eee5" stroke-width="2" /><text x="114" y="321" font-size="29" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="114" dy="0">Aplicación Python</tspan></text><text x="114" y="369" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="114" dy="0">Utiliza sqlite3 y el motor SQLite</tspan></text><text x="114" y="409" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="114" dy="0">dentro de su proceso.</tspan></text><line x1="367" y1="451" x2="367" y2="530" stroke="#246b50" stroke-width="4" marker-end="url(#g)" /><rect x="86" y="544" width="561" height="156" rx="18" fill="#e8eff6" stroke="#d9e1db" stroke-width="2" /><text x="114" y="594" font-size="29" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="114" dy="0">mediciones.sqlite3</tspan></text><text x="114" y="642" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="114" dy="0">Archivo local con tablas y registros</tspan></text><text x="85" y="755" font-size="24" fill="#536772" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="85" dy="0">Acceso mediante permisos del archivo.</tspan></text><rect x="742" y="273" width="613" height="112" rx="18" fill="#e8eff6" stroke="#e8eff6" stroke-width="2" /><text x="774" y="322" font-size="29" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="774" dy="0">Aplicación Python</tspan></text><text x="774" y="362" font-size="23" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="774" dy="0">Cliente de la base de datos</tspan></text><line x1="1048" y1="397" x2="1048" y2="478" stroke="#2565a0" stroke-width="4" marker-end="url(#b)" /><text x="774" y="427" font-size="22" fill="#2565a0" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="774" dy="0">Conexión, usuario</tspan><tspan x="774" dy="31.24">y permisos</tspan></text><rect x="742" y="493" width="613" height="112" rx="18" fill="#e8eff6" stroke="#e8eff6" stroke-width="2" /><text x="774" y="542" font-size="29" fill="#2565a0" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="774" dy="0">Servidor MySQL</tspan></text><text x="774" y="582" font-size="23" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="774" dy="0">En el mismo equipo o en otro</tspan></text><line x1="1048" y1="617" x2="1048" y2="677" stroke="#2565a0" stroke-width="4" marker-end="url(#b)" /><rect x="742" y="691" width="613" height="100" rx="18" fill="white" stroke="#d9e1db" stroke-width="2" /><text x="774" y="751" font-size="28" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="774" dy="0">Bases de datos y tablas</tspan></text><text x="56" y="889" font-size="25" fill="#246b50" font-family="DejaVu Sans, sans-serif" font-weight="700"><tspan x="56" dy="0">En ambos casos, el navegador consulta la aplicación web; no abre la base directamente.</tspan></text><text x="56" y="939" font-size="24" fill="#203541" font-family="DejaVu Sans, sans-serif" font-weight="400"><tspan x="56" dy="0">La elección depende de quién escribe, dónde estarán los datos y cómo se administrará el acceso.</tspan></text></svg>